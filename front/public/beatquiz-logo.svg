<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="beatquizGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6E6E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFDF6B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Headphone icon -->
  <g transform="translate(30, 20)">
    <!-- Left ear -->
    <path d="M 5 15 A 8 8 0 0 1 5 5" stroke="url(#beatquizGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right ear -->
    <path d="M 55 15 A 8 8 0 0 0 55 5" stroke="url(#beatquizGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center band -->
    <path d="M 13 5 Q 30 0 47 5" stroke="url(#beatquizGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left speaker -->
    <circle cx="13" cy="20" r="6" fill="none" stroke="url(#beatquizGradient)" stroke-width="2"/>
    <circle cx="13" cy="20" r="3" fill="url(#beatquizGradient)"/>

    <!-- Right speaker -->
    <circle cx="47" cy="20" r="6" fill="none" stroke="url(#beatquizGradient)" stroke-width="2"/>
    <circle cx="47" cy="20" r="3" fill="url(#beatquizGradient)"/>
  </g>

  <!-- Music notes -->
  <g transform="translate(55, 50)">
    <!-- First note -->
    <circle cx="5" cy="15" r="3" fill="url(#beatquizGradient)"/>
    <path d="M 8 15 L 8 2" stroke="url(#beatquizGradient)" stroke-width="2" stroke-linecap="round"/>

    <!-- Second note (higher) -->
    <circle cx="20" cy="10" r="3" fill="url(#beatquizGradient)"/>
    <path d="M 23 10 L 23 0" stroke="url(#beatquizGradient)" stroke-width="2" stroke-linecap="round"/>

    <!-- Connecting beam -->
    <path d="M 8 2 Q 15 1 23 0" stroke="url(#beatquizGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>

